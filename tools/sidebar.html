<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!--
  Source for assets/sidebar.webp - the "What you get" figure in the READMEs.
  Render at 1720x1900 and save as assets/sidebar.webp.

  It used to be a single portrait capture, and it only ever showed the dark
  theme. Here the light capture is the base and the dark one is stacked on top
  of it, offset so it lands squarely on the light capture's code area and stops
  short of its panel. Both panels stay visible, the two themes are one figure
  rather than two pictures, and the overlap says which one is on top the way
  stacked windows always have.

  Captures are portrait 2160x3840. Both are drawn at the same scale (0.621), so
  the two panels come out the same size and can be compared row for row.
-->
<style>
  html, body { margin: 0; width: 1720px; height: 1900px; overflow: hidden; background: #0d0d10; }
  body { font-family: "Inter", "Segoe UI", "Helvetica Neue", Arial, sans-serif; position: relative; }

  .shot { position: absolute; overflow: hidden; border-radius: 14px; }
  .shot img { position: absolute; width: 1341px; left: 0; }

  /* Base: the light desktop, panel and code both in view. */
  .base {
    left: 60px; top: 60px; width: 1180px; height: 1780px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 0 1px rgba(233,233,240,0.12);
  }
  .base img { top: -591px; }

  /* Overlay: the dark desktop, offset horizontally only, and far enough right
     that a strip of the base's code survives beside its panel - butted up
     against the panel the light half proved nothing but the panel itself.
     Tops and heights match the base, which puts the same rows at the same
     height in both and lets them be read across. The offset is what stacks
     them; the heavier shadow is what says which one is on top. */
  .over {
    left: 700px; top: 60px; width: 960px; height: 1780px;
    box-shadow: 0 40px 90px rgba(0,0,0,0.75), 0 0 0 1px rgba(233,233,240,0.16);
  }
  .over img { top: -590px; }
  /* The overlay's crop lands mid-row at the bottom; fade it out so the excerpt
     ends rather than being sliced. The base needs none - its panel runs out
     before the card does. */
  .over::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(180deg, transparent 92%, rgba(13,13,16,0.92) 100%);
  }

  .label {
    position: absolute; font-size: 21px; letter-spacing: 0.14em;
    text-transform: uppercase; color: #7e7a72;
  }
  .label::before {
    content: ""; display: inline-block; width: 11px; height: 11px; border-radius: 50%;
    margin-right: 13px; vertical-align: 1px;
  }
  .label-light { left: 62px; top: 16px; }
  .label-light::before { background: #e9e9f0; }
  .label-dark { left: 702px; top: 16px; }
  .label-dark::before { background: #3a3a44; box-shadow: 0 0 0 1px rgba(233,233,240,0.4); }
</style>
</head>
<body>
  <div class="label label-light">light desktop</div>
  <div class="shot base"><img src="file:///C:/Users/root/Downloads/Snipaste_2026-09-16_17-49-54.png"></div>

  <div class="label label-dark">dark desktop</div>
  <div class="shot over"><img src="file:///C:/Users/root/Downloads/Snipaste_2026-09-16_17-52-13.png"></div>
</body>
</html>
